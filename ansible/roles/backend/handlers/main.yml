- name: Create systemd unit
  template:
    src: birthday-reminder.service.j2
    dest: /etc/systemd/system/birthday-reminder.service
  become: yes

- name: Reload systemd
  systemd:
    daemon_reload: yes
  become: yes

- name: Start birthday reminder service
  systemd:
    name: birthday-reminder
    state: restarted
    enabled: yes
  become: yes