<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поздравлятор</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Основной стиль для футера */
        .deepseek-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid #eaeaea;
            padding: 12px 0;
            text-align: center;
            font-size: 13px;
            color: #666;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }
        
        /* Только на мобильных - скрыть на маленьких экранах */
        @media (max-width: 768px) {
            .deepseek-footer {
                font-size: 12px;
                padding: 10px 0;
            }
        }
        
        /* Ссылка */
        .deepseek-footer a {
            color: #3b82f6;
            text-decoration: none;
            margin: 0 4px;
            font-weight: 500;
        }
        
        .deepseek-footer a:hover {
            text-decoration: underline;
        }
        
        /* Добавить отступ для основного контента */
        body {
            margin-bottom: 50px;
        }
    </style>
    <style>
        .birthday-card {
            transition: transform 0.2s;
            border-left: 4px solid #0d6efd;
        }
        .birthday-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .today-birthday {
            border-left-color: #198754;
            background-color: rgba(25, 135, 84, 0.05);
        }
        .birthday-badge {
            font-size: 0.8em;
        }
        .upcoming-item {
            border-bottom: 1px solid #dee2e6;
            padding: 10px 0;
        }
        .avatar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #e9ecef;
            color: #495057;
            font-weight: 600;
            flex-shrink: 0;
            overflow: hidden;
        }
        .avatar-img {
            object-fit: cover;
            width: 100%;
            height: 100%;
        }
        .avatar-md {
            width: 48px;
            height: 48px;
            font-size: 16px;
        }
        .avatar-sm {
            width: 32px;
            height: 32px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <header class="mb-4">
            <h1 class="text-center">🎂 Поздравлятор</h1>
            <p class="text-center text-muted">Отслеживайте дни рождения ваших друзей и коллег</p>
        </header>

        <div class="row">
            <!-- Сегодняшние дни рождения -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">🎉 Сегодня празднуют</h5>
                    </div>
                    <div class="card-body">
                        <div id="todayBirthdays">
                            <div class="text-center">
                                <div class="spinner-border text-success" role="status">
                                    <span class="visually-hidden">Загрузка...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Ближайшие дни рождения -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">📅 Ближайшие дни рождения</h5>
                    </div>
                    <div class="card-body">
                        <div id="upcomingBirthdays">
                            <div class="text-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Загрузка...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Форма добавления нового дня рождения -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">➕ Добавить день рождения</h5>
            </div>
            <div class="card-body">
                <form id="birthdayForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="firstName" class="form-label">Имя</label>
                            <input type="text" class="form-control" id="firstName" required>
                        </div>
                        <div class="col-md-6">
                            <label for="lastName" class="form-label">Фамилия</label>
                            <input type="text" class="form-control" id="lastName" required>
                        </div>
                        <div class="col-md-6">
                            <label for="birthDate" class="form-label">Дата рождения</label>
                            <input type="date" class="form-control" id="birthDate" required>
                        </div>
                        <div class="col-md-6">
                            <label for="photo" class="form-label">Фото</label>
                            <input type="file" class="form-control" id="photo" accept="image/*">
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">Добавить</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Все дни рождения -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">📋 Все дни рождения</h5>
            </div>
            <div class="card-body">
                <div id="allBirthdays">
                    <div class="text-center">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Загрузка...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="card mb-3">
        <div class="card-header">
            <h6 class="mb-0">⚙️ Настройки отображения</h6>
        </div>
        <div class="card-body">
            <div class="row align-items-center">
                <div class="col-auto">
                    <label for="limitSlider" class="form-label">
                        Количество ближайших ДР: 
                        <span id="limitValue" class="badge bg-primary">5</span>
                    </label>
                </div>
                <div class="col">
                    <input type="range" class="form-range" id="limitSlider" 
                        min="1" max="20" value="5">
                </div>
                <div class="col-auto">
                    <button class="btn btn-sm btn-outline-primary" onclick="saveSettings()">
                        💾 Сохранить
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- Модальное окно для редактирования -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Редактировать день рождения</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <label for="editFirstName" class="form-label">Имя</label>
                            <input type="text" class="form-control" id="editFirstName" required>
                        </div>
                        <div class="mb-3">
                            <label for="editLastName" class="form-label">Фамилия</label>
                            <input type="text" class="form-control" id="editLastName" required>
                        </div>
                        <div class="mb-3">
                            <label for="editBirthDate" class="form-label">Дата рождения</label>
                            <input type="date" class="form-control" id="editBirthDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="editPhoto" class="form-label">Фото</label>
                            <input type="file" class="form-control" id="editPhoto" accept="image/*">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" onclick="updateBirthday()">Сохранить</button>
                </div>
            </div>
        </div>
    </div>
    <div class="deepseek-footer">
        Шаблон статики создан при помощи <a href="https://www.deepseek.com" target="_blank" rel="noopener noreferrer">DeepSeek</a> AI Assistant
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
